<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>wolai → 博客同步</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
  h1 { text-align: center; margin-bottom: 2rem; color: #6c63ff; }
  .form-group { margin-bottom: 1rem; max-width: 600px; margin-left: auto; margin-right: auto; }
  label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #94a3b8; }
  input, textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 0.95rem; }
  textarea { min-height: 300px; font-family: monospace; resize: vertical; }
  button { padding: 0.8rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #6c63ff, #00d9ff); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-copy { background: #334155; color: #e2e8f0; margin-left: 0.5rem; }
  .btn-copy:hover { background: #475569; }
  .output { max-width: 600px; margin: 2rem auto; }
  .output pre { background: #1e293b; padding: 1rem; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; font-size: 0.85rem; white-space: pre-wrap; }
  .steps { max-width: 600px; margin: 0 auto 2rem; background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
  .steps h3 { margin-bottom: 0.8rem; color: #00d9ff; }
  .steps ol { padding-left: 1.2rem; }
  .steps li { margin-bottom: 0.5rem; font-size: 0.9rem; color: #94a3b8; }
  .success { color: #22c55e; text-align: center; margin-top: 1rem; font-weight: 600; }
</style>
</head>
<body>

<h1>📝 wolai → 博客同步</h1>

<div class="steps">
  <h3>使用方法</h3>
  <ol>
    <li>在 wolai 里写好文章</li>
    <li>全选文章内容（Ctrl+A），复制（Ctrl+C）</li>
    <li>粘贴到下面的输入框</li>
    <li>填写标题，点「生成」</li>
    <li>点「复制」，粘贴到 <code>content/blog/</code> 目录下的新 .md 文件</li>
    <li><code>git push</code> 上线</li>
  </ol>
</div>

<div class="form-group">
  <label>文章标题</label>
  <input type="text" id="title" placeholder="我的博客文章标题">
</div>

<div class="form-group">
  <label>日期</label>
  <input type="date" id="date">
</div>

<div class="form-group">
  <label>标签（逗号分隔）</label>
  <input type="text" id="tags" placeholder="FPGA, 偏振控制, 算法">
</div>

<div class="form-group">
  <label>从 wolai 粘贴内容</label>
  <textarea id="content" placeholder="在这里粘贴 wolai 的文章内容..."></textarea>
</div>

<div class="form-group">
  <button class="btn-primary" onclick="generate()">生成 Markdown</button>
  <button class="btn-copy" onclick="copyOutput()">📋 复制</button>
</div>

<div class="output" id="outputArea" style="display:none;">
  <label style="color:#94a3b8;font-size:0.9rem;">生成的 Markdown 文件内容：</label>
  <pre id="output"></pre>
  <p class="success" id="successMsg" style="display:none;"></p>
</div>

<script>
  // 设置默认日期
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);

  function convertWolai(text) {
    // 简单的 wolai 格式转换
    let md = text;
    // 移除多余空行
    md = md.replace(/\n{3,}/g, '\n\n');
    return md.trim();
  }

  function generate() {
    const title = document.getElementById('title').value || '未命名文章';
    const date = document.getElementById('date').value;
    const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const content = document.getElementById('content').value;

    const frontmatter = `---
title: "${title}"
date: "${date}"
tags: [${tags.map(t => `"${t}"`).join(', ')}]
description: ""
published: true
---`;

    const output = frontmatter + '\n\n' + convertWolai(content);
    document.getElementById('output').textContent = output;
    document.getElementById('outputArea').style.display = 'block';
  }

  function copyOutput() {
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const msg = document.getElementById('successMsg');
      msg.textContent = '✅ 已复制到剪贴板！粘贴到 content/blog/xxx.md 文件即可';
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    });
  }
</script>

</body>
</html>
