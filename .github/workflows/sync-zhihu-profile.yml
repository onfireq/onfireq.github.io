name: Sync Zhihu Profile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-zhihu-profile.yml
      - scripts/sync-zhihu-profile.ps1
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: sync-zhihu-profile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public profile likes
        shell: pwsh
        run: ./scripts/sync-zhihu-profile.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-profile
          path: public/zhihu-profile.json
          if-no-files-found: error

  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: zhihu-profile
          path: public
      - name: Publish validated profile snapshot
        shell: bash
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add public/zhihu-profile.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update automatically fetched Zhihu profile likes"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-pages:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
