name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate static Zhihu snapshot
        run: npm run snapshot:check

      - name: Test static Zhihu snapshot safeguards
        run: npm run snapshot:test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Cloudflare Worker bundle
        run: npm run worker:check

      - name: Test Cloudflare Worker
        run: npm run worker:test

      - name: Build static site
        run: npm run build
