name: Sync Zhihu Data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-zhihu.yml
      - scripts/*zhihu*
      - sync_zhihu.py
  schedule:
    # Profile totals and content snapshots are published together each hour.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-zhihu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test profile metric safeguards
        shell: pwsh
        run: ./scripts/test-zhihu-profile.ps1

      - name: Fetch all four profile totals
        shell: pwsh
        run: ./scripts/sync-zhihu-profile.ps1

      - name: Download zhihu-cli
        shell: pwsh
        run: |
          $url = "https://developer-cdn.zhihu.com/zhihu-cli/releases/stable/cli/0.2.0/zhihu-cli-0.2.0-windows-amd64.zip"
          $archive = "zhihu-cli.zip"
          $cliDirectory = Join-Path $PWD "zhihu-cli"
          $expectedSha256 = "2e3a56b6e70c1263288dc6556e02c415b8d49a42ef2a2209125264830f2a9b09"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "zhihu-cli archive checksum mismatch."
          }
          Expand-Archive -Path $archive -DestinationPath $cliDirectory -Force
          $cliDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Zhihu data
        shell: pwsh
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZHIHU_ACCESS_SECRET)) {
            throw "ZHIHU_ACCESS_SECRET is not configured."
          }

          function Invoke-ZhihuCli {
            param(
              [string[]]$Arguments,
              [string]$OutputFile,
              [string]$ErrorFile
            )

            & zhihu-cli @Arguments 1> $OutputFile 2> $ErrorFile
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              if (Test-Path $ErrorFile) {
                Get-Content $ErrorFile
              }
              throw "zhihu-cli failed with exit code $exitCode."
            }
          }

          Invoke-ZhihuCli -Arguments @("me", "contents", "--type", "all", "--limit", "50") -OutputFile "zhihu_raw.json" -ErrorFile "zhihu_raw.err"

      - name: Generate site data
        shell: pwsh
        run: python sync_zhihu.py

      - name: Validate generated snapshot
        shell: pwsh
        run: python sync_zhihu.py --check

      - name: Export browser feed
        shell: pwsh
        run: python scripts/export-zhihu-feed.py

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: zhihu-data
          path: |
            src/data/zhihu.ts
            public/zhihu-profile.json
            public/zhihu-feed.json
          if-no-files-found: error

  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: zhihu-data
          path: .

      - name: Commit and push
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/zhihu.ts public/zhihu-profile.json public/zhihu-feed.json

          if git diff --staged --quiet; then
            echo "No Zhihu data changes to commit."
            exit 0
          fi

          timestamp="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          git commit -m "🤖 自动同步知乎数据 ${timestamp}"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-pages:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
