name: Sync Zhihu Stats

on:
  schedule:
    # 每周一北京时间 4:00（UTC 20:00 每周日）
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest  # 用 Windows 因为 zhihu-cli 是 Windows 版本
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (for zhihu-cli)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install zhihu-cli
        run: |
          mkdir -p "$env:LOCALAPPDATA\ZhihuCLI\current"
          # 尝试从 GitHub Release 下载（如果有的话）
          # 这里我们直接调用已有的 exe
          $env:ZHIPU_CLI = "$env:LOCALAPPDATA\ZhihuCLI\current\zhihu-cli.exe"
          if (-not (Test-Path $env:ZHIPU_CLI)) {
            echo "::warning::zhihu-cli.exe not found, skipping"
            exit 0
          }

      - name: Fetch Zhihu stats
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\ZhihuCLI\current\zhihu-cli.exe"
          if (-not (Test-Path $exe)) { exit 0 }

          $out = & $exe me contents --type all --limit 1 --pretty 2>&1 | Out-String
          $data = $out | ConvertFrom-Json
          $followers = $data.Data.Items[0].Author.FollowerCount
          if (-not $followers) { $followers = 18 }

          $updated = Get-Date -Format "yyyy-MM-dd HH:mm"
          $json = @{
            followers = $followers
            updated = $updated
          } | ConvertTo-Json
          $json | Out-File -FilePath "public/zhihu.json" -Encoding utf8

          echo "Followers: $followers"

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/zhihu.json
          $diff = git diff --cached --quiet
          if (-not $diff) {
            git commit -m "🔄 自动同步知乎关注者数"
            git push
          } else {
            echo "无变化"
          }
