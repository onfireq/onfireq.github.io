name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A sync workflow can create a newer commit than its original SHA.
          # Always build the latest published main branch snapshot.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Validate static Zhihu snapshot
        run: npm run snapshot:check

      - name: Test static Zhihu snapshot safeguards
        run: npm run snapshot:test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Cloudflare Worker
        run: npm run worker:check

      - name: Test Cloudflare Worker
        run: npm run worker:test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
